# Fly.io deploy (alternative to the homelab). See README → "Deploy to Fly.io".
#   fly launch --no-deploy --copy-config
#   fly postgres create && fly postgres attach <pg-app>      # sets DATABASE_URL
#   fly volumes create trivia_data --size 1
#   fly secrets set AUTH_SECRET=$(openssl rand -base64 36) APP_URL=https://<app>.fly.dev
#   fly deploy
app = "triviapig"
primary_region = "den"

[build]

[env]
  PORT = "3000"
  STORAGE_DRIVER = "local"
  UPLOAD_DIR = "/data/uploads"
  TRUST_PROXY = "true"

[mounts]
  source = "trivia_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Game state lives in memory while a game runs: keep exactly one machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
