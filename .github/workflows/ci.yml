name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Build + end-to-end smoke test
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jeppidy
          POSTGRES_PASSWORD: jeppidy
          POSTGRES_DB: jeppidy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeppidy" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://jeppidy:jeppidy@localhost:5432/jeppidy?schema=public
      AUTH_SECRET: ci-secret-not-for-production
      APP_URL: http://localhost:3000
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npm run build
      - name: Start server
        run: |
          node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
      - run: npx tsx scripts/smoke.ts
      - if: failure()
        run: cat server.log
