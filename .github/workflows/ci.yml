name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in CI needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Build + end-to-end smoke test
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jeppidy
          POSTGRES_PASSWORD: jeppidy
          POSTGRES_DB: jeppidy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jeppidy" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://jeppidy:jeppidy@localhost:5432/jeppidy?schema=public
      AUTH_SECRET: ci-secret-not-for-production
      APP_URL: http://localhost:3000
      NODE_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npm run build
      - name: Start server
        run: |
          node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
      - run: npx tsx scripts/smoke.ts
      - name: Crash recovery (hard-kill the server mid-game, restart, resume)
        run: npx tsx scripts/crash-test.ts
      - if: failure()
        run: cat server.log

  docker:
    name: Docker image boots, recovers from a crash
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate the homelab compose file
        working-directory: deploy/homelab
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=x AUTH_SECRET=y docker compose --profile keycloak --profile minio --profile caddy config -q
          sh -n scripts/backup.sh && sh -n scripts/restore.sh && sh -n scripts/update.sh && sh -n scripts/install-autodeploy.sh
      - name: Build and start (app + Postgres)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health and readiness
        run: |
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/readyz
      - name: Server runs as the unprivileged app user
        run: |
          owner=$(docker compose exec -T app sh -c 'for p in /proc/[0-9]*; do if grep -qa "dist/server[.]js" $p/cmdline 2>/dev/null; then stat -c %U $p; fi; done' | head -1)
          echo "server process owner: $owner"
          test "$owner" = "app"
      - name: Kill the app process; Docker must bring it back healthy
        run: |
          # Kill node inside the container (a "docker kill" counts as a manual stop and would not restart).
          docker compose exec -T app sh -c 'for p in /proc/[0-9]*; do if grep -qa "dist/server[.]js" $p/cmdline 2>/dev/null; then kill -9 ${p#/proc/}; fi; done' || true
          sleep 3
          for i in $(seq 1 90); do curl -fsS http://localhost:3000/readyz && exit 0; sleep 2; done
          exit 1
      - name: Restart Postgres under the app; app must stay up and reconnect
        run: |
          docker compose restart db
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/readyz && exit 0; sleep 2; done
          exit 1
      - if: failure()
        run: docker compose logs --tail 200
