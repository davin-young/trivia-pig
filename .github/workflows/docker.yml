name: Docker image

# The release step of the pipeline. Publishes ghcr.io/<owner>/<repo>:latest only after the
# CI workflow has passed on main (and :vX.Y.Z on tags). The homelab's deploy timer
# (deploy/homelab/scripts/install-autodeploy.sh) pulls :latest and switches to it at the next
# moment when nobody is in a game, so a red build never reaches the live site.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time, oldest first, so :latest always ends on the newest commit.
concurrency:
  group: release-image
  cancel-in-progress: false

# Read-only by default; the one job that publishes asks for more.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # keyless signing: proves the image was built by this workflow
    # After CI: only when it passed, and only for a push (never a pull request from a fork).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      # The commit that CI tested (for a tag or a manual run, the commit that triggered this).
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - id: commit
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown on /readyz, so you can see which commit is live.
          build-args: |
            APP_VERSION=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          # Attach an SBOM and build provenance to the published image.
          sbom: true
          provenance: mode=max
      # Sign the image by digest with this workflow's identity (no key to keep secret). The
      # homelab's update script can then refuse any image this workflow did not build:
      # see VERIFY_IMAGE_SIGNER in deploy/homelab/.env.example.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
