name: Docker image

# The release step of the pipeline. Publishes ghcr.io/<owner>/<repo>:latest only after the
# CI workflow has passed on main (and :vX.Y.Z on tags). The homelab's deploy timer
# (deploy/homelab/scripts/install-autodeploy.sh) pulls :latest and switches to it at the next
# moment when nobody is in a game, so a red build never reaches the live site.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time, oldest first, so :latest always ends on the newest commit.
concurrency:
  group: release-image
  cancel-in-progress: false

# Read-only by default; the one job that publishes asks for more.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    # After CI: only when it passed, and only for a push (never a pull request from a fork).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      # The commit that CI tested (for a tag or a manual run, the commit that triggered this).
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.COMMIT }}
      - id: commit
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown on /readyz, so you can see which commit is live.
          build-args: |
            APP_VERSION=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          # Attach an SBOM and build provenance to the published image.
          sbom: true
          provenance: mode=max
