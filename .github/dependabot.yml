# Weekly dependency updates. Minor and patch npm updates arrive as one grouped pull request;
# security updates are opened on their own as soon as an advisory is published.
# The 7-day cooldown skips versions published in the last week, when a hijacked release is
# most likely to still be live. It does not delay security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types must match the Node major the image runs (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keeps the commit SHAs that pin each GitHub Action current. One pull request for all of
  # them, so actions that must move together (codeql-action init and analyze) do.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Keeps the digest-pinned Node base image in the Dockerfile current. Moving to a new Node
  # major is a deliberate choice (only even-numbered releases are long-term support).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/homelab
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
