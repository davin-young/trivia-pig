# One-command local run:  docker compose up --build
# Dev with hot reload:    docker compose up -d db && npm run dev
# Images are stored in a Docker volume. For S3-style storage instead, start MinIO with
# `docker compose --profile minio up -d` and set STORAGE_DRIVER=s3 plus the S3_* values on the app.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-secret-change-me}
      DATABASE_URL: postgresql://jeppidy:jeppidy@db:5432/jeppidy?schema=public
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: jeppidy
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      ALLOW_SIGNUP: "true"
      SEED_DEMO: "true"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jeppidy
      POSTGRES_PASSWORD: jeppidy
      POSTGRES_DB: jeppidy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeppidy"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional (profile "minio"). MinIO no longer publishes images on Docker Hub; these come from quay.io.
  minio:
    profiles: [minio]
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    profiles: [minio]
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/jeppidy"

volumes:
  pgdata:
  uploads:
  miniodata:
