# Trivia Pig on a homelab, published at https://triviapig.lol through a Cloudflare Tunnel.
#
#   cp .env.example .env    # fill in secrets
#   docker compose up -d                          # app + db + tunnel
#   docker compose --profile keycloak up -d       # ...plus a bundled Keycloak at auth.triviapig.lol
#   docker compose --profile caddy up -d          # alternative to the tunnel: Caddy with Let's Encrypt (ports 80/443)
#
# Nothing here publishes a port to your LAN except the optional Caddy profile;
# cloudflared makes an outbound connection to Cloudflare, so no port forwarding is needed.

name: triviapig

services:
  app:
    image: ${APP_IMAGE:-triviapig:local}
    # "build" builds from this repo. To pull a published image instead, set
    # APP_IMAGE=ghcr.io/<you>/jeppidy:latest and APP_PULL_POLICY=always in .env.
    pull_policy: ${APP_PULL_POLICY:-build}
    build:
      context: ../..
      args:
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Trivia Pig}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trivia:${POSTGRES_PASSWORD}@db:5432/trivia?schema=public
      PORT: "3000"
      TRUST_PROXY: "true"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # Uncomment to reach the app directly on your LAN (e.g. http://homelab:3000) while setting up:
    # ports:
    #   - "3000:3000"
    networks: [internal, edge]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trivia
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia -d trivia"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  # Nightly pg_dump into ./data/backups (keeps 7 daily, 4 weekly, 6 monthly).
  backup:
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: trivia
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./data/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Cloudflare Tunnel. Create it in Zero Trust → Networks → Tunnels, copy the token
  # into TUNNEL_TOKEN, and add public hostnames:
  #   triviapig.lol        → http://app:3000
  #   auth.triviapig.lol   → http://keycloak:8080   (only if you use the keycloak profile)
  cloudflared:
    image: cloudflare/cloudflared:2025.4.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    networks: [edge]

  # ---------------------------------------------------------------- optional

  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${KEYCLOAK_HOST:-auth.triviapig.lol}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # substituted into keycloak/trivia-realm.json on first import
      TRIVIA_APP_URL: ${APP_URL}
      TRIVIA_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    volumes:
      - ./keycloak/trivia-realm.json:/opt/keycloak/data/import/trivia-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [internal, edge]

  keycloak-db:
    profiles: [keycloak]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - ./data/keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  # S3-compatible media storage, if you prefer it over the local ./data/uploads folder.
  # Set STORAGE_DRIVER=s3 and the S3_* values in .env (see .env.example).
  minio:
    profiles: [minio]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-trivia}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-please}
    volumes:
      - ./data/minio:/data
    networks: [internal]

  minio-init:
    profiles: [minio]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS} &&
      mc mb --ignore-existing local/$${BUCKET}"
    environment:
      MINIO_USER: ${S3_ACCESS_KEY_ID:-trivia}
      MINIO_PASS: ${S3_SECRET_ACCESS_KEY:-change-me-please}
      BUCKET: ${S3_BUCKET:-trivia}
    networks: [internal]

  # Alternative to Cloudflare Tunnel: Caddy terminates TLS itself (forward ports 80+443 to this box).
  caddy:
    profiles: [caddy]
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on: [app]
    networks: [edge]

networks:
  internal:
  edge:
