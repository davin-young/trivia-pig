# Trivia Pig sign-in pages: Keycloak's current login theme, re-coloured to match the app.
# Only a stylesheet, a favicon and a few words change, so Keycloak upgrades keep working.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/triviapig-2.css
# Static files are cached for 30 days (browser and Cloudflare): bump the number in the
# stylesheet name whenever it changes.
# The theme is dark for everyone (like the app), so PatternFly's own light/dark switch is off.
darkMode=false
